name: Backend verification
on: [push, pull_request]
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careguardian_test
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runner -d careguardian_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://runner@127.0.0.1:5432/careguardian_test
      # Groq is always mocked in tests; never configure a real key in CI.
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Compile all modules
        run: python -m compileall -q app scripts migrations
      - name: Migrations on an empty PostgreSQL (twice, must be idempotent)
        env:
          DATABASE_URL: postgresql+psycopg://runner@127.0.0.1:5432/careguardian_test
        run: |
          alembic upgrade head
          alembic upgrade head
          psql postgresql://runner@127.0.0.1:5432/careguardian_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
      - run: python -m pytest -q --tb=short --cov=app --cov=scripts --cov-report=term-missing:skip-covered --cov-fail-under=85
